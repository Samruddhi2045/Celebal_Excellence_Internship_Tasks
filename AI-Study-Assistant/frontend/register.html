<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Create Account | AI Study Assistant
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="register-page">


<div class="register-container">


    <div class="register-brand">

        <img
            src="assets/graduation-cap.png"
            alt="AI Study Assistant"
            class="register-logo"
        >

        <h1>
            AI Study Assistant
        </h1>

        <p>
            Your smart study companion
        </p>

    </div>

    <div class="register-box">


        <div class="register-heading">

            <h2>
                Create your account
            </h2>

            <p>
                Set up your personal study workspace.
            </p>

        </div>

        <form id="registerForm">


            <div class="register-field">

                <label for="name">
                    Full name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >

            </div>

            <div class="register-field">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="register-field">

                <label for="password">
                    Password
                </label>

                <div class="register-password">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('password', this)"
                    >
                        Show
                    </button>

                </div>

                <small>
                    Use at least 6 characters.
                </small>

            </div>

            <div class="register-field">

                <label for="confirmPassword">
                    Confirm password
                </label>

                <div class="register-password">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        Show
                    </button>

                </div>

            </div>

            <div
                id="registerMessage"
                class="register-message"
            ></div>


            <!-- SUBMIT -->

            <button
                type="submit"
                id="registerButton"
                class="register-submit"
            >
                Create account
            </button>


        </form>

        <div class="register-login">

            <span>
                Already have an account?
            </span>

            <a href="index.html">
                Sign in
            </a>

        </div>


    </div>

    <div class="register-footer">

        Your study space, your documents, your questions.

    </div>


</div>


<script>

const API_URL =
    "http://127.0.0.1:5000/api";


const registerForm =
    document.getElementById(
        "registerForm"
    );


const registerButton =
    document.getElementById(
        "registerButton"
    );


const registerMessage =
    document.getElementById(
        "registerMessage"
    );

function togglePassword(
    inputId,
    button
) {

    const input =
        document.getElementById(
            inputId
        );


    if (
        input.type === "password"
    ) {

        input.type =
            "text";

        button.textContent =
            "Hide";

    }

    else {

        input.type =
            "password";

        button.textContent =
            "Show";

    }

}

function showMessage(
    message,
    success = false
) {

    registerMessage.textContent =
        message;

    registerMessage.style.display =
        "block";


    if (success) {

        registerMessage.className =
            "register-message success";

    }

    else {

        registerMessage.className =
            "register-message error";

    }

}

registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        if (!name) {

            showMessage(
                "Please enter your name."
            );

            return;

        }


        if (!email) {

            showMessage(
                "Please enter your email address."
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters."
            );

            return;

        }


        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "Passwords do not match."
            );

            return;

        }


        registerButton.disabled =
            true;

        registerButton.textContent =
            "Creating account...";


        registerMessage.style.display =
            "none";


        try {


            const response =
                await fetch(

                    `${API_URL}/auth/register`,

                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                name:
                                    name,

                                email:
                                    email,

                                password:
                                    password

                            })

                    }

                );


            const data =
                await response.json();


            console.log(
                "Register response:",
                data
            );


            if (!response.ok) {

                throw new Error(

                    data.detail ||
                    data.message ||
                    "Registration failed."

                );

            }


            showMessage(

                "Account created successfully. Redirecting to login...",

                true

            );


            registerButton.textContent =
                "Account created";


            setTimeout(

                function() {

                    window.location.href =
                        "index.html";

                },

                1400

            );


        }

        catch (error) {

            console.error(
                "Registration error:",
                error
            );


            showMessage(

                error.message ||
                "Unable to create your account."

            );


            registerButton.disabled =
                false;

            registerButton.textContent =
                "Create account";

        }

    }
);

</script>


</body>

</html>
