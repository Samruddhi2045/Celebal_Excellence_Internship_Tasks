<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>History - AI Study Assistant</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .history-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .history-header {
            margin-bottom: 30px;
        }

        .history-header h1 {
            margin-bottom: 8px;
        }

        .history-card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .history-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .history-document {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 18px;
        }

        .history-message {
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 10px;
            line-height: 1.5;
        }

        .history-user {
            background: #f3f3f3;
        }

        .history-ai {
            background: #fce8f3;
        }

        .message-role {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .empty-history {
            text-align: center;
            padding: 70px 20px;
            background: white;
            border-radius: 16px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="history-container">

    <a
        href="dashboard.html"
        class="back-button"
    >
        ← Back to Dashboard
    </a>


    <div class="history-header">

        <h1>
            Conversation History
        </h1>

        <p>
            Review your previous study conversations.
        </p>

    </div>


    <div id="historyList">

        <div class="empty-history">
            Loading history...
        </div>

    </div>

</div>


<script>

const API_URL =
    "http://127.0.0.1:5000/api";


const token =
    localStorage.getItem(
        "access_token"
    );


if (!token) {

    window.location.href =
        "index.html";

}


async function loadHistory() {

    const container =
        document.getElementById(
            "historyList"
        );


    try {

        const response =
            await fetch(
                `${API_URL}/history`,
                {

                    headers: {

                        "Authorization":
                            `Bearer ${token}`

                    }

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Could not load history."
            );

        }


        const history =
            data.history || [];


        if (history.length === 0) {

            container.innerHTML = `

                <div class="empty-history">

                    <h2>
                        No conversations yet
                    </h2>

                    <p>
                        Start chatting with one
                        of your study documents.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML =
            history.map(
                conversation => `

                    <div class="history-card">

                        <div class="history-title">
                            ${escapeHtml(
                                conversation.title
                            )}
                        </div>

                        <div class="history-document">
                            Conversation #${conversation.id}
                        </div>

                        <div>

                            ${conversation.messages
                                .map(
                                    message => `

                                    <div class="
                                        history-message
                                        ${
                                            message.role ===
                                            "user"
                                                ? "history-user"
                                                : "history-ai"
                                        }
                                    ">

                                        <div class="message-role">

                                            ${
                                                message.role ===
                                                "user"
                                                    ? "You"
                                                    : "AI Assistant"
                                            }

                                        </div>

                                        <div>
                                            ${escapeHtml(
                                                message.content
                                            )}
                                        </div>

                                    </div>

                                `
                                )
                                .join("")
                            }

                        </div>

                    </div>

                `
            )
            .join("");

    }

    catch (error) {

        console.error(
            error
        );


        container.innerHTML = `

            <div class="empty-history">

                <h2>
                    Could not load history
                </h2>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


loadHistory();

</script>


</body>

</html>
